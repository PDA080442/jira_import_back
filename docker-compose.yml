services:
  db:
    image: postgres:16-alpine
    container_name: jira_import_db
    environment:
      POSTGRES_DB: jira_import
      POSTGRES_USER: jira_import
      POSTGRES_PASSWORD: jira_import
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_import -d jira_import"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
