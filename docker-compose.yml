services:
  db:
    image: postgres:16-alpine
    container_name: jira_import_db
    environment:
      POSTGRES_DB: jira_import
      POSTGRES_USER: jira_import
      POSTGRES_PASSWORD: jira_import
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_import -d jira_import"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jira_import_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: jira_import_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
