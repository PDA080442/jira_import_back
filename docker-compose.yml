x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.dev
  SECRET_KEY: django-insecure-docker-dev-only
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,django
  DATABASE_URL: postgres://jira_import:jira_import@db:5432/jira_import
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  EMAIL_HOST: mailhog
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  FRONTEND_URL: http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    container_name: jira_import_db
    environment:
      POSTGRES_DB: jira_import
      POSTGRES_USER: jira_import
      POSTGRES_PASSWORD: jira_import
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_import -d jira_import"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jira_import_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    container_name: jira_import_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  django:
    build: .
    container_name: jira_import_django
    entrypoint: ["bash", "docker/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      <<: *app-environment
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  celery:
    build: .
    container_name: jira_import_celery
    entrypoint: ["bash", "docker/entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres_data:
